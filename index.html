<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="">
        <meta name="keywords" content="">
        <meta name="author" content="shadow_evi">
        <title>Таблиця</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <h1>Число</h1>
        <h2 id="h">Облік відсутніх</h2> <!--Чи щось таке-->
        <form>
            <label>
                ПІБ студента
                <input type="text" id="student">
            </label>
            <button id="add">Додати</button>
        </form>
        <button id="clean">Oчистити</button>
        <h2 id="number">Кількість студентів:</h2>
        <button id="saveChange" class="hidden button">Зберегти зміни</button>
        <button id="edit" class="hidden button">Редагувати</button>
        <button id="sort" class="button">Сортувати</button>
        <div id="table">
        <table>
            <thead>
            <tr>
                <th id="count">№</th>
                <th id="name">ПІБ</th>
                <th class="pairs">1 пара</th>
                <th class="pairs">2 пара</th>
                <th class="pairs">3 пара</th>
                <th class="pairs">4 пара</th>
                <th id="hours">Години</th>
                <th id="reason">Причина</th>
                <th id="note">Примітка</th>
                <th id="file">Додати файл</th>
                <th id="delet">Видалити</th>
            </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
        </div>
        <div id="modal" class="hidden">
            <div id="window">
                <h3 id="">Ви впевнені?</h3>
                <button id="yes">Так</button>
                <button id="no">Ні</button>
            </div>
        </div>
        <script src="js/script.js"></script>
    </body>
    </html>
